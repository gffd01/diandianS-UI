name: Update public REALITY target feed

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

concurrency:
  group: reality-target-feed
  cancel-in-progress: false

jobs:
  update-feed:
    if: github.repository == 'gffd01/diandianS-UI'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Build a fresh candidate feed
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/update-reality-targets.py
          python3 .github/scripts/update-reality-targets.py --output "$RUNNER_TEMP/reality-targets.json"

      - name: Publish without triggering a product release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin reality-targets >/dev/null 2>&1; then
            git switch -C reality-targets origin/reality-targets
          else
            git switch --orphan reality-targets
            git rm -rf --ignore-unmatch .
          fi
          cp "$RUNNER_TEMP/reality-targets.json" reality-targets.json
          git add reality-targets.json
          if git diff --cached --quiet; then
            echo "Candidate feed is unchanged."
          else
            git commit -m "data: refresh REALITY target candidates"
            git push origin HEAD:reality-targets
          fi
